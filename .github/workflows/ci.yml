name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  backend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start isolated E2E stack
        run: docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml up -d --build --wait
      - name: Verify host-side readiness
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:18080/health/ready
      - name: Run backend E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_DATABASE_URL: postgres://restaurant_test:restaurant_test@127.0.0.1:55432/restaurant_delivery_test?sslmode=disable
        run: go test -count=1 -tags=e2e ./tests/e2e
      - name: Run restart and dependency resilience E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_DATABASE_URL: postgres://restaurant_test:restaurant_test@127.0.0.1:55432/restaurant_delivery_test?sslmode=disable
        run: bash scripts/e2e-resilience.sh
      - name: Verify encrypted PostgreSQL backup and restore
        run: docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml run --rm --build backup-restore-drill
      - name: Verify migration rollback and reapply on populated database
        run: |
          docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml run --rm migrations \
            -path=/migrations -database='postgres://restaurant_test:restaurant_test@postgres:5432/restaurant_delivery_test?sslmode=disable' down 1
          docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml run --rm migrations \
            -path=/migrations -database='postgres://restaurant_test:restaurant_test@postgres:5432/restaurant_delivery_test?sslmode=disable' up
          docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml run --rm partner-fixtures
          curl --fail http://127.0.0.1:18080/api/v1/restaurants
      - name: Print service logs
        if: failure()
        run: docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml logs --no-color
      - name: Stop isolated E2E stack
        if: always()
        run: docker compose -p restaurant-delivery-e2e -f docker-compose.e2e.yml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Scan source, dependencies, configuration and secrets
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          aquasec/trivy:0.76.0
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /workspace
      - name: Build release images
        run: |
          docker build --build-arg SERVICE=platform-api --tag restaurant-platform:${GITHUB_SHA} .
          docker build --tag restaurant-web:${GITHUB_SHA} frontend
      - name: Scan release images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 restaurant-platform:${GITHUB_SHA}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 restaurant-web:${GITHUB_SHA}
