openapi: 3.0.3
info:
  title: Restaurant Delivery Platform API
  version: 0.11.0
  description: API for customers and partner restaurants in the delivery platform.
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: Auth
  - name: Customer
  - name: Partner
  - name: Health
paths:
  /health/live:
    get:
      summary: Check process liveness
      tags: [Health]
      operationId: live
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Check service readiness
      tags: [Health]
      operationId: ready
      responses:
        '200':
          description: Service is ready
        '503':
          description: A dependency is unavailable
  /api/v1/restaurants:
    get:
      summary: List active restaurants
      tags: [Customer]
      operationId: listRestaurants
      responses:
        '200':
          description: Active restaurants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
  /api/v1/restaurants/{restaurantId}/menu:
    get:
      summary: Get restaurant menu and availability
      tags: [Customer]
      operationId: getRestaurantMenu
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Current menu and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/register:
    post:
      summary: Register a customer and issue a token pair
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      summary: Authenticate a customer and issue a token pair
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      summary: Rotate the HttpOnly refresh cookie and issue a new access token
      tags: [Auth]
      operationId: refreshSession
      responses:
        '200':
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      summary: Revoke the current refresh-token family and clear its cookie
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Session revoked
  /api/v1/auth/logout-all:
    post:
      summary: Revoke every refresh session of the authenticated customer
      tags: [Auth]
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      summary: Return the authenticated customer
      tags: [Auth]
      security:
        - bearerAuth: []
      operationId: getCurrentUser
      responses:
        '200':
          description: Current customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/addresses:
    get:
      summary: List saved delivery addresses
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: listAddresses
      responses:
        '200':
          description: Saved addresses, default first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Save a delivery address
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a saved delivery address
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a saved delivery address
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: deleteAddress
      responses:
        '204':
          description: Address deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/quote:
    post:
      summary: Calculate and validate an order draft
      tags: [Customer]
      operationId: quoteOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDraft'
      responses:
        '200':
          description: Server-calculated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderQuote'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/orders:
    get:
      summary: List orders of the current user
      tags: [Customer]
      operationId: listUserOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders sorted from newest to oldest
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      summary: Create an order idempotently
      tags: [Customer]
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrderDraft'
                - type: object
                  required: [deliveryAddress]
                  properties:
                    deliveryAddress:
                      type: string
                      minLength: 1
                      maxLength: 500
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Existing order returned for the same idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/orders/{orderId}:
    get:
      summary: Get the current order state
      tags: [Customer]
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{orderId}/events:
    get:
      summary: Stream order state changes with Server-Sent Events
      tags: [Customer]
      operationId: streamOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: Last processed numeric status event ID. Events with greater IDs are replayed from PostgreSQL before live streaming starts.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: SSE stream with `order` events containing an Order JSON object
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{orderId}/cancel:
    post:
      summary: Cancel an order before preparation starts
      tags: [Customer]
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reasonCode]
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                reasonCode:
                  $ref: '#/components/schemas/CustomerCancellationReasonCode'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Cancelled order with restored inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /partner/v1/menu:
    get:
      summary: Get the authenticated restaurant menu for editing
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: getPartnerMenu
      responses:
        '200':
          description: Editable restaurant menu with external identifiers and inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerMenu'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace the authenticated restaurant menu
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: replacePartnerMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerMenu'
      responses:
        '204':
          description: Menu accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /partner/v1/orders:
    get:
      summary: List orders for the authenticated restaurant
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: listPartnerOrders
      responses:
        '200':
          description: Restaurant orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /partner/v1/orders/events:
    get:
      summary: Stream the authenticated restaurant order queue with Server-Sent Events
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: streamPartnerOrders
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Last processed numeric order event ID. The server always returns an authoritative PostgreSQL snapshot with a current high-watermark ID.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: SSE stream with `orders` events containing the current restaurant order list
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /partner/v1/orders/{orderId}/status:
    patch:
      summary: Update a restaurant order status
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: updatePartnerOrderStatus
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedVersion]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                reasonCode:
                  $ref: '#/components/schemas/RestaurantRejectionReasonCode'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /partner/v1/outbox/dead-letters:
    get:
      summary: List failed integration events for the authenticated restaurant
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: listPartnerDeadLetters
      responses:
        '200':
          description: Dead-letter events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboxFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /partner/v1/outbox/dead-letters/{eventId}/replay:
    post:
      summary: Retry a dead-letter event owned by the authenticated restaurant
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: replayPartnerDeadLetter
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Audit-Reason
          in: header
          required: false
          description: Operational reason stored in the append-only partner audit log
          schema:
            type: string
            maxLength: 500
      responses:
        '204':
          description: Event returned to the delivery queue
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /partner/v1/credentials:
    get:
      summary: List access credentials for the authenticated restaurant
      description: Requires the `owner` role. Secret values and hashes are never returned.
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: listPartnerCredentials
      responses:
        '200':
          description: Credential metadata, including expiry, revocation and last use
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a partner access credential
      description: Requires the `owner` role. The generated secret is returned exactly once; overlap allows zero-downtime rotation.
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: createPartnerCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                role:
                  $ref: '#/components/schemas/PartnerRole'
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Credential metadata and its one-time secret
          content:
            application/json:
              schema:
                type: object
                required: [credential, secret]
                properties:
                  credential:
                    $ref: '#/components/schemas/PartnerCredential'
                  secret:
                    type: string
                    description: One-time plaintext credential; store it in a secret manager.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /partner/v1/credentials/{credentialId}/revoke:
    post:
      summary: Revoke a partner access credential
      description: Requires the `owner` role. The current credential cannot revoke itself and at least one active owner credential must remain.
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: revokePartnerCredential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '204':
          description: Credential revoked immediately
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /partner/v1/audit:
    get:
      summary: List the authenticated restaurant audit trail
      description: Returns up to 200 newest append-only records. Requires the `owner` or `operator` role.
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: listPartnerAudit
      responses:
        '200':
          description: Newest audit records first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerAuditRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    partnerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped restaurant credential with an owner, manager, kitchen or operator role. Keys may expire or be revoked immediately.
  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthorized:
      description: Missing or invalid authentication credential
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated role does not permit this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Registration:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
          minLength: 1
    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      description: The refresh token is returned only as an HttpOnly SameSite cookie.
      required: [user, accessToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Access-token lifetime in seconds
    AddressInput:
      type: object
      required: [label, address]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 3
          maxLength: 500
        isDefault:
          type: boolean
          default: false
    AddressPatch:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 3
          maxLength: 500
        isDefault:
          type: boolean
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, userId, label, address, isDefault, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    Restaurant:
      type: object
      required: [id, name, description, isOpen, cuisine, eta, rating, art]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        isOpen:
          type: boolean
        cuisine:
          type: string
        eta:
          type: string
        rating:
          type: string
          example: '4.8'
        art:
          type: string
          enum: [bread, pasta, sushi]
    Product:
      type: object
      required: [id, name, description, priceMinor, currency, available, quantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          example: RUB
        available:
          type: boolean
        quantity:
          type: integer
          minimum: 0
    MenuCategory:
      type: object
      required: [id, name, products]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    Menu:
      type: object
      required: [restaurant, categories]
      properties:
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        categories:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MenuCategory'
    DraftItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    OrderDraft:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DraftItem'
    QuoteItem:
      type: object
      required: [productId, name, quantity, unitPriceMinor, totalMinor]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
        unitPriceMinor:
          type: integer
          format: int64
        totalMinor:
          type: integer
          format: int64
    OrderQuote:
      type: object
      required: [restaurantId, items, deliveryFeeMinor, totalMinor, currency]
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        deliveryFeeMinor:
          type: integer
          format: int64
          minimum: 0
        totalMinor:
          type: integer
          format: int64
        currency:
          type: string
          example: RUB
    OrderStatus:
      type: string
      enum: [pending, accepted, rejected, preparing, ready, delivering, delivered, cancelled]
    CustomerCancellationReasonCode:
      type: string
      enum: [customer_changed_mind, wrong_delivery_address, other]
    RestaurantRejectionReasonCode:
      type: string
      enum: [restaurant_busy, item_unavailable, restaurant_closing, other]
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderQuote'
        - type: object
          required: [id, userId, status, version, deliveryAddress, createdAt]
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/OrderStatus'
            version:
              type: integer
              format: int64
              minimum: 1
            statusReasonCode:
              type: string
              nullable: true
            deliveryAddress:
              type: string
            rejectionReason:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
    PartnerMenu:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          maxItems: 50
          items:
            type: object
            required: [externalId, name, products]
            properties:
              externalId:
                type: string
                maxLength: 100
              name:
                type: string
                maxLength: 100
              position:
                type: integer
              products:
                type: array
                maxItems: 500
                items:
                  type: object
                  required: [externalId, name, priceMinor, quantity, available]
                  properties:
                    externalId:
                      type: string
                      maxLength: 100
                    name:
                      type: string
                      maxLength: 200
                    description:
                      type: string
                      maxLength: 1000
                    priceMinor:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 100000000
                    quantity:
                      type: integer
                      minimum: 0
                      maximum: 1000000
                    available:
                      type: boolean
    PartnerRole:
      type: string
      enum: [owner, manager, kitchen, operator]
    PartnerCredential:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/PartnerRole'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PartnerAuditRecord:
      type: object
      required: [id, action, resourceType, metadata, createdAt]
      properties:
        id:
          type: integer
          format: int64
        credentialId:
          type: string
          format: uuid
        credentialName:
          type: string
        role:
          $ref: '#/components/schemas/PartnerRole'
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        requestId:
          type: string
        traceId:
          type: string
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string
    OutboxFailure:
      type: object
      required: [eventId, orderId, eventType, eventVersion, attempts, lastError, deadLetteredAt]
      properties:
        eventId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        eventType:
          type: string
        eventVersion:
          type: integer
        attempts:
          type: integer
        lastError:
          type: string
        deadLetteredAt:
          type: string
          format: date-time
