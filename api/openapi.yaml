openapi: 3.0.3
info:
  title: Restaurant Delivery Platform API
  version: 0.4.0
  description: API for customers and partner restaurants in the delivery platform.
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: Auth
  - name: Customer
  - name: Partner
  - name: Health
paths:
  /health/live:
    get:
      summary: Check process liveness
      tags: [Health]
      operationId: live
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Check service readiness
      tags: [Health]
      operationId: ready
      responses:
        '200':
          description: Service is ready
        '503':
          description: A dependency is unavailable
  /api/v1/restaurants:
    get:
      summary: List active restaurants
      tags: [Customer]
      operationId: listRestaurants
      responses:
        '200':
          description: Active restaurants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
  /api/v1/restaurants/{restaurantId}/menu:
    get:
      summary: Get restaurant menu and availability
      tags: [Customer]
      operationId: getRestaurantMenu
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Current menu and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/register:
    post:
      summary: Register a customer and issue a token pair
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      summary: Authenticate a customer and issue a token pair
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      tags: [Auth]
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      summary: Return the authenticated customer
      tags: [Auth]
      security:
        - bearerAuth: []
      operationId: getCurrentUser
      responses:
        '200':
          description: Current customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/addresses:
    get:
      summary: List saved delivery addresses
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: listAddresses
      responses:
        '200':
          description: Saved addresses, default first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Save a delivery address
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a saved delivery address
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a saved delivery address
      tags: [Customer]
      security:
        - bearerAuth: []
      operationId: deleteAddress
      responses:
        '204':
          description: Address deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/quote:
    post:
      summary: Calculate and validate an order draft
      tags: [Customer]
      operationId: quoteOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDraft'
      responses:
        '200':
          description: Server-calculated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderQuote'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/orders:
    get:
      summary: List orders of the current user
      tags: [Customer]
      operationId: listUserOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders sorted from newest to oldest
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      summary: Create an order idempotently
      tags: [Customer]
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrderDraft'
                - type: object
                  required: [deliveryAddress]
                  properties:
                    deliveryAddress:
                      type: string
                      minLength: 1
                      maxLength: 500
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Existing order returned for the same idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/orders/{orderId}:
    get:
      summary: Get the current order state
      tags: [Customer]
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orders/{orderId}/events:
    get:
      summary: Stream order state changes with Server-Sent Events
      tags: [Customer]
      operationId: streamOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream with `order` events containing an Order JSON object
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /partner/v1/menu:
    put:
      summary: Replace the authenticated restaurant menu
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: replacePartnerMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerMenu'
      responses:
        '204':
          description: Menu accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /partner/v1/orders:
    get:
      summary: List orders for the authenticated restaurant
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: listPartnerOrders
      responses:
        '200':
          description: Restaurant orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /partner/v1/orders/{orderId}/status:
    patch:
      summary: Update a restaurant order status
      tags: [Partner]
      security:
        - partnerApiKey: []
      operationId: updatePartnerOrderStatus
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    partnerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthorized:
      description: Invalid partner API key
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Registration:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
          minLength: 1
    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [user, accessToken, refreshToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Access-token lifetime in seconds
    AddressInput:
      type: object
      required: [label, address]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 3
          maxLength: 500
        isDefault:
          type: boolean
          default: false
    AddressPatch:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 3
          maxLength: 500
        isDefault:
          type: boolean
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, userId, label, address, isDefault, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    Restaurant:
      type: object
      required: [id, name, description, isOpen]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        isOpen:
          type: boolean
    Product:
      type: object
      required: [id, name, description, priceMinor, currency, available, quantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          example: RUB
        available:
          type: boolean
        quantity:
          type: integer
          minimum: 0
    MenuCategory:
      type: object
      required: [id, name, products]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    Menu:
      type: object
      required: [restaurant, categories]
      properties:
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'
    DraftItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    OrderDraft:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DraftItem'
    QuoteItem:
      type: object
      required: [productId, name, quantity, unitPriceMinor, totalMinor]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
        unitPriceMinor:
          type: integer
          format: int64
        totalMinor:
          type: integer
          format: int64
    OrderQuote:
      type: object
      required: [restaurantId, items, deliveryFeeMinor, totalMinor, currency]
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        deliveryFeeMinor:
          type: integer
          format: int64
          minimum: 0
        totalMinor:
          type: integer
          format: int64
        currency:
          type: string
          example: RUB
    OrderStatus:
      type: string
      enum: [pending, accepted, rejected, preparing, ready, delivering, delivered, cancelled]
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderQuote'
        - type: object
          required: [id, userId, status, deliveryAddress, createdAt]
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/OrderStatus'
            deliveryAddress:
              type: string
            rejectionReason:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
    PartnerMenu:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [externalId, name, products]
            properties:
              externalId:
                type: string
                maxLength: 100
              name:
                type: string
                maxLength: 200
              position:
                type: integer
              products:
                type: array
                items:
                  type: object
                  required: [externalId, name, priceMinor, quantity, available]
                  properties:
                    externalId:
                      type: string
                      maxLength: 100
                    name:
                      type: string
                      maxLength: 200
                    description:
                      type: string
                      maxLength: 1000
                    priceMinor:
                      type: integer
                      format: int64
                      minimum: 0
                    quantity:
                      type: integer
                      minimum: 0
                    available:
                      type: boolean
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string
