global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: [platform-api:8080]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

