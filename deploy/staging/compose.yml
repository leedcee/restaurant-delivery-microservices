name: restaurant-delivery-staging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant_delivery
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U restaurant -d restaurant_delivery]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrations:
    build:
      context: ../..
      dockerfile: deploy/staging/migrations.Dockerfile
    profiles: [release]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    volumes:
      - ../../migrations:/migrations:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  partner-bootstrap:
    image: postgres:17-alpine
    user: postgres
    profiles: [release]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PARTNER_SECRET_FILE: /run/secrets/demo_partner_key
      RESTAURANT_ID: 11111111-1111-1111-1111-111111111111
      CREDENTIAL_NAME: Staging demo owner
    secrets: [database_url, demo_partner_key]
    volumes:
      - ./bootstrap-partner.sh:/bootstrap-partner.sh:ro
    entrypoint: [/bin/sh, /bootstrap-partner.sh]
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [clickhouse_password]
    volumes:
      - ../clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    networks: [data]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  platform-api:
    image: ${PLATFORM_IMAGE:?PLATFORM_IMAGE must be an immutable tag or digest}
    environment:
      APP_ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      PLATFORM_HTTP_ADDR: :8080
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${STAGING_HOST:?STAGING_HOST is required}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: [database_url, jwt_secret, clickhouse_password]
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [CMD, /service, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  demo-restaurant:
    image: ${DEMO_IMAGE:?DEMO_IMAGE must be an immutable tag or digest}
    profiles: [demo]
    environment:
      APP_ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DEMO_HTTP_ADDR: :8081
      PLATFORM_BASE_URL: http://platform-api:8080
      DEMO_API_KEY_FILE: /run/secrets/demo_partner_key
    secrets: [demo_partner_key]
    networks: [app]
    depends_on:
      platform-api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable tag or digest}
    networks: [app]
    depends_on:
      platform-api:
        condition: service_healthy
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  ingress:
    image: caddy:2.11.7-alpine
    environment:
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, app]
    depends_on:
      web:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${STAGING_SECRETS_DIR:?STAGING_SECRETS_DIR is required}/postgres_password
  database_url:
    file: ${STAGING_SECRETS_DIR:?STAGING_SECRETS_DIR is required}/database_url
  jwt_secret:
    file: ${STAGING_SECRETS_DIR:?STAGING_SECRETS_DIR is required}/jwt_secret
  clickhouse_password:
    file: ${STAGING_SECRETS_DIR:?STAGING_SECRETS_DIR is required}/clickhouse_password
  demo_partner_key:
    file: ${STAGING_SECRETS_DIR:?STAGING_SECRETS_DIR is required}/demo_partner_key

networks:
  edge:
  app:
    internal: true
  data:
    internal: true

volumes:
  postgres-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
