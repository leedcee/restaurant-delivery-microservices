name: restaurant-delivery-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant_delivery_test
      POSTGRES_USER: restaurant_test
      POSTGRES_PASSWORD: restaurant_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_test -d restaurant_delivery_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrations:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://restaurant_test:restaurant_test@postgres:5432/restaurant_delivery_test?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-api:
    build:
      context: .
      args:
        SERVICE: platform-api
    environment:
      DATABASE_URL: postgres://restaurant_test:restaurant_test@postgres:5432/restaurant_delivery_test?sslmode=disable
      PLATFORM_HTTP_ADDR: :8080
      JWT_SECRET: e2e-only-secret
    ports:
      - "18080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  demo-restaurant:
    build:
      context: .
      args:
        SERVICE: demo-restaurant
    environment:
      DEMO_HTTP_ADDR: :8081
      PLATFORM_BASE_URL: http://platform-api:8080
      DEMO_API_KEY: demo-secret
    ports:
      - "18081:8081"
    depends_on:
      platform-api:
        condition: service_healthy
