services:
  platform-api:
    environment:
      APP_ENVIRONMENT: local
      APP_VERSION: compose
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
    depends_on:
      otel-collector:
        condition: service_started
      clickhouse:
        condition: service_healthy

  demo-restaurant:
    environment:
      APP_ENVIRONMENT: local
      APP_VERSION: compose
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yml]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    command: [-config.file=/etc/tempo.yml]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.5.5
    profiles: [observability]
    command: [-config.file=/etc/loki/local-config.yml]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.5.5
    profiles: [observability]
    command: [-config.file=/etc/promtail/config.yml]
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    profiles: [observability]
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tempo-data:
  loki-data:
  clickhouse-data:

