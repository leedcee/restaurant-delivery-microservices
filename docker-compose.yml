name: avito-kitchen

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrations:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kitchen-api:
    build:
      context: .
      args:
        SERVICE: kitchen-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
      KITCHEN_HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-restaurant:
    build:
      context: .
      args:
        SERVICE: demo-restaurant
    environment:
      DEMO_HTTP_ADDR: :8081
      KITCHEN_BASE_URL: http://kitchen-api:8080
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-secret}
    ports:
      - "8081:8081"
    depends_on:
      kitchen-api:
        condition: service_started

volumes:
  postgres-data:
