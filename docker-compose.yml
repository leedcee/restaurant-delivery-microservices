name: restaurant-delivery-system

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrations:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD:-restaurant}@postgres:5432/${POSTGRES_DB:-restaurant_delivery}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  partner-fixtures:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-restaurant}
    volumes:
      - ./fixtures:/fixtures:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-restaurant}
      - -d
      - ${POSTGRES_DB:-restaurant_delivery}
      - -f
      - /fixtures/partners.sql
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  platform-api:
    build:
      context: .
      args:
        SERVICE: platform-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD:-restaurant}@postgres:5432/${POSTGRES_DB:-restaurant_delivery}?sslmode=disable
      PLATFORM_HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      EVENT_CLEANUP_INTERVAL: ${EVENT_CLEANUP_INTERVAL:-1h}
      PROCESSED_EVENT_RETENTION: ${PROCESSED_EVENT_RETENTION:-168h}
      DEAD_LETTER_RETENTION: ${DEAD_LETTER_RETENTION:-720h}
      EVENT_CLEANUP_BATCH_SIZE: ${EVENT_CLEANUP_BATCH_SIZE:-1000}
    ports:
      - "8080:8080"
    depends_on:
      partner-fixtures:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      platform-api:
        condition: service_healthy

  demo-restaurant:
    build:
      context: .
      args:
        SERVICE: demo-restaurant
    environment:
      DEMO_HTTP_ADDR: :8081
      PLATFORM_BASE_URL: http://platform-api:8080
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-secret}
      DEMO_PARTNER_API_KEYS: 22222222-2222-2222-2222-222222222222=pasta-secret,33333333-3333-3333-3333-333333333333=sushi-secret
    ports:
      - "8081:8081"
    depends_on:
      platform-api:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD:-restaurant}@postgres:5432/${POSTGRES_DB:-restaurant_delivery}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      platform-api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
